<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0f0f0f"/>

  <rect x="0" y="0" width="1200" height="64" fill="#1a1a1a"/>
  <rect x="0" y="0" width="1200" height="4" fill="#ff3040"/>

  <text x="24" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#ff3040">buzzfeed</text>

  <g transform="translate(300, 40)">
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#f5f5f5">Home</text>
    <text x="60" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#f5f5f5">Trending</text>
    <text x="140" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#f5f5f5">Quizzes</text>
    <text x="220" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#a3a3a3">Vídeos</text>
    <text x="300" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#a3a3a3">Culinária</text>
  </g>

  <circle cx="1100" cy="32" r="12" fill="#f5f5f5"/>
  <path d="M1100 24 L1100 40 M1092 32 L1108 32" stroke="#0f0f0f" stroke-width="2" stroke-linecap="round"/>
  <rect x="1120" y="22" width="24" height="20" rx="4" fill="#2d2d2d"/>
  <rect x="1128" y="28" width="8" height="8" fill="#ff3040"/>

  <rect x="0" y="80" width="1200" height="160" fill="url(#heroGradient)"/>
  <defs>
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3040"/>
      <stop offset="50%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#ffc107"/>
    </linearGradient>
  </defs>

  <text x="600" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="white">buzzfeed</text>
  <text x="600" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="rgba(255,255,255,0.9)">Notícias, entretenimento, quizzes e matérias curiosas</text>

  <g transform="translate(80, 260)">
    <rect x="0" y="0" width="100" height="36" rx="18" fill="#2d2d2d" stroke="#ff3040" stroke-width="2"/>
    <text x="50" y="23" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#ff3040">Todos</text>
    <rect x="110" y="0" width="100" height="36" rx="18" fill="#3a3a3a"/>
    <text x="160" y="23" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#a3a3a3">Ciência</text>
    <rect x="220" y="0" width="100" height="36" rx="18" fill="#3a3a3a"/>
    <text x="270" y="23" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#a3a3a3">Quizzes</text>
    <rect x="330" y="0" width="100" height="36" rx="18" fill="#3a3a3a"/>
    <text x="380" y="23" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#a3a3a3">Culinária</text>
  </g>

  <g transform="translate(80, 330)">
    <foreignObject x="0" y="0" width="260" height="300">
      <div xmlns="http://www.w3.org/1999/xhtml" style="background:#1a1a1a;border:1px solid #333;border-radius:12px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,0.4);">
        <div style="height:140px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);display:flex;align-items:flex-end;padding:16px;">
          <span style="background:#ff3040;color:#fff;font-size:12px;font-weight:700;padding:4px 12px;border-radius:16px;text-transform:uppercase;">Ciência</span>
        </div>
        <div style="padding:16px;">
          <h3 style="font-size:18px;color:#f5f5f5;margin-bottom:8px;line-height:1.4;">10 Curiosidades Surpreendentes Sobre o Espaço</h3>
          <p style="font-size:14px;color:#a3a3a3;line-height:1.5;margin-bottom:12px;">Você sabia que existe um dia no espaço?</p>
          <a href="#" style="font-size:14px;font-weight:700;color:#ff3040;">Leia mais</a>
        </div>
      </div>
    </foreignObject>

    <foreignObject x="300" y="0" width="260" height="300">
      <div xmlns="http://www.w3.org/1999/xhtml" style="background:#1a1a1a;border:2px solid #ff3040;border-radius:12px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,0.4);">
        <div style="height:140px;background:linear-gradient(135deg,#fa709a 0%,#fee149 100%);display:flex;align-items:flex-end;padding:16px;">
          <span style="background:#ff3040;color:#fff;font-size:12px;font-weight:700;padding:4px 12px;border-radius:16px;text-transform:uppercase;">Quizzes</span>
        </div>
        <div style="padding:16px;">
          <h3 style="font-size:18px;color:#f5f5f5;margin-bottom:8px;line-height:1.4;">Você Seria Herói ou Vilão?</h3>
          <p style="font-size:14px;color:#a3a3a3;line-height:1.5;margin-bottom:12px;">Responda a estas perguntas e descubra sua verdadeira natureza!</p>
          <button style="font-size:16px;font-weight:700;color:#fff;background:#ff3040;padding:12px 20px;border:none;border-radius:8px;cursor:pointer;">Fazer Quiz</button>
        </div>
      </div>
    </foreignObject>

    <foreignObject x="600" y="0" width="260" height="300">
      <div xmlns="http://www.w3.org/1999/xhtml" style="background:#1a1a1a;border:1px solid #333;border-radius:12px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,0.4);">
        <div style="height:140px;background:linear-gradient(135deg,#12c2e9 0%,#c6306c 100%);display:flex;align-items:flex-end;padding:16px;">
          <span style="background:#ff3040;color:#fff;font-size:12px;font-weight:700;padding:4px 12px;border-radius:16px;text-transform:uppercase;">Entretenimento</span>
        </div>
        <div style="padding:16px;">
          <h3 style="font-size:18px;color:#f5f5f5;margin-bottom:8px;line-height:1.4;">Top 20 Séries 2024</h3>
          <p style="font-size:14px;color:#a3a3a3;line-height:1.5;margin-bottom:12px;">Confira as séries mais aguardadas do ano.</p>
          <a href="#" style="font-size:14px;font-weight:700;color:#ff3040;">Leia mais</a>
        </div>
      </div>
    </foreignObject>

    <foreignObject x="900" y="0" width="260" height="300">
      <div xmlns="http://www.w3.org/1999/xhtml" style="background:#1a1a1a;border:1px solid #333;border-radius:12px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,0.4);">
        <div style="height:140px;background:linear-gradient(135deg,#43e97b 0%,#38f9d7 100%);display:flex;align-items:flex-end;padding:16px;">
          <span style="background:#ff3040;color:#fff;font-size:12px;font-weight:700;padding:4px 12px;border-radius:16px;text-transform:uppercase;">Culinária</span>
        </div>
        <div style="padding:16px;">
          <h3 style="font-size:18px;color:#f5f5f5;margin-bottom:8px;line-height:1.4;">Pão Caseiro Passo a Passo</h3>
          <p style="font-size:14px;color:#a3a3a3;line-height:1.5;margin-bottom:12px;">Aprenda a fazer pão caseiro crocante por fora.</p>
          <a href="#" style="font-size:14px;font-weight:700;color:#ff3040;">Leia mais</a>
        </div>
      </div>
    </foreignObject>
  </g>

  <rect x="0" y="560" width="1200" height="70" fill="#1a1a1a"/>
  <text x="600" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" color="#ff3040">buzzfeed</text>
  <text x="600" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#a3a3a3">Réplica do BuzzFeed | Projeto de Portfólio</text>
</svg>
